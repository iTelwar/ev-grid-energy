AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  EV Grid Energy production (evgridenergy.com). Dedicated VPC, ALB, ECS Fargate
  service, DynamoDB lead store and SNS notifications. Independent of every
  other application in this account; shares only the account-level GitHub
  OIDC provider. Deploy with infra/deploy.sh.

Parameters:
  ImageTag:
    Type: String
    Default: bootstrap
    Description: Tag in the ev-grid-energy-web ECR repository. infra/deploy.sh passes the currently deployed tag.
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 4
  CertificateArn:
    Type: String
    Default: ""
    Description: ISSUED ACM certificate for evgridenergy.com + www (stack ev-grid-energy-prod-certificate). Empty = HTTP only, pre-launch.
  VerificationCidr:
    Type: String
    Default: ""
    Description: Temporary /32 allowed to reach the ALB directly during pre-launch verification. Leave empty in normal operation.
  GitHubRepository:
    Type: String
    Default: iTelwar/ev-grid-energy
  CanonicalHost:
    Type: String
    Default: evgridenergy.com

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasVerificationCidr: !Not [!Equals [!Ref VerificationCidr, ""]]

Resources:
  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: ev-grid-energy-vpc }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: ev-grid-energy-igw }]

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: ev-grid-energy-public-a }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: ev-grid-energy-public-b }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: ev-grid-energy-public-rt }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Free gateway endpoint; the policy limits it to the EV Grid Energy lead table.
  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PublicRouteTable]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: ["dynamodb:PutItem", "dynamodb:UpdateItem", "dynamodb:GetItem"]
            Resource: !GetAtt LeadsTable.Arn

  # Cloudflare's published IPv4 ranges. Entries are managed by
  # infra/sync-cloudflare-ips.sh (run at deploy time and weekly by GitHub
  # Actions), not by this template.
  CloudflarePrefixList:
    Type: AWS::EC2::PrefixList
    Properties:
      PrefixListName: ev-grid-energy-cloudflare-ipv4
      AddressFamily: IPv4
      MaxEntries: 25

  # ------------------------------------------------------- security groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: ev-grid-energy-alb-sg
      GroupDescription: EV Grid Energy ALB - HTTPS/HTTP from Cloudflare only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, SourcePrefixListId: !Ref CloudflarePrefixList, Description: Cloudflare HTTPS }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudflarePrefixList, Description: Cloudflare HTTP (redirect) }
      # Replaces the default allow-all egress; the real rule is AlbToAppEgress.
      SecurityGroupEgress:
        - { IpProtocol: icmp, FromPort: 252, ToPort: 86, CidrIp: 255.255.255.255/32, Description: Disallow all traffic }
      Tags: [{ Key: Name, Value: ev-grid-energy-alb-sg }]

  AlbVerificationHttps:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasVerificationCidr
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref VerificationCidr
      Description: TEMPORARY pre-launch verification

  AlbVerificationHttp:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasVerificationCidr
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref VerificationCidr
      Description: TEMPORARY pre-launch verification

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: ev-grid-energy-app-sg
      GroupDescription: EV Grid Energy web tasks - app port from the EV Grid Energy ALB only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "AWS APIs (ECR, CloudWatch Logs, SNS, DynamoDB)" }
      Tags: [{ Key: Name, Value: ev-grid-energy-app-sg }]

  AppFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: From ev-grid-energy-alb-sg

  AlbToAppEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      DestinationSecurityGroupId: !Ref AppSecurityGroup
      Description: To ev-grid-energy-app-sg

  # ------------------------------------------------------------------ data
  LeadsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ev-grid-energy-leads
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: leadId, AttributeType: S }]
      KeySchema: [{ AttributeName: leadId, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: true
      # SSESpecification omitted: encrypted at rest with an AWS owned key. No TTL.

  LeadNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ev-grid-energy-lead-notifications
      DisplayName: EV Grid Energy Leads
      KmsMasterKeyId: alias/aws/sns

  LeadNotificationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref LeadNotificationsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AppPublish
            Effect: Allow
            Principal: { AWS: !GetAtt TaskRole.Arn }
            Action: sns:Publish
            Resource: !Ref LeadNotificationsTopic
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sns:Publish
            Resource: !Ref LeadNotificationsTopic
            Condition: { Bool: { aws:SecureTransport: "false" } }

  # Unencrypted on purpose: CloudWatch alarms and Budgets cannot publish to a
  # topic encrypted with the AWS managed SNS key. Carries no customer data.
  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ev-grid-energy-ops-alerts
      DisplayName: EV Grid Energy Ops

  OpsAlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref OpsAlertsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudWatchAlarms
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref OpsAlertsTopic
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
          - Sid: Budgets
            Effect: Allow
            Principal: { Service: budgets.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref OpsAlertsTopic
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }

  # ------------------------------------------------------------------ images
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ev-grid-energy-web
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the 10 most recent images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  # --------------------------------------------------------------- logging
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/ev-grid-energy/web
      RetentionInDays: 30

  LeadNotificationFailedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.event = "lead.notification_failed" }'
      MetricTransformations:
        - { MetricNamespace: EVGridEnergy, MetricName: LeadNotificationFailures, MetricValue: "1", DefaultValue: 0 }

  LeadStoreFailedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.event = "lead.store_failed" }'
      MetricTransformations:
        - { MetricNamespace: EVGridEnergy, MetricName: LeadStoreFailures, MetricValue: "1", DefaultValue: 0 }

  # ------------------------------------------------------------------- IAM
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ev-grid-energy-task-execution
      Description: EV Grid Energy ECS execution - pull ev-grid-energy-web, write /aws/ev-grid-energy/web
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
      Policies:
        - PolicyName: ev-grid-energy-task-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${LogGroup.Arn}

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ev-grid-energy-task
      Description: EV Grid Energy application - lead table and lead topic only
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike: { aws:SourceArn: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:*" }
      Policies:
        - PolicyName: ev-grid-energy-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:GetItem]
                Resource: !GetAtt LeadsTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref LeadNotificationsTopic

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ev-grid-energy-github-deploy
      Description: GitHub Actions (iTelwar/ev-grid-energy, main only) - push image and roll the EV Grid Energy service
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com" }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: ev-grid-energy-github-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Sid: TaskDefinitions # these actions do not support resource-level permissions
                Effect: Allow
                Action: [ecs:RegisterTaskDefinition, ecs:DescribeTaskDefinition]
                Resource: "*"
              - Sid: RollService
                Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: !Ref Service
              - Sid: PassOnlyEvGridEnergyTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskExecutionRole.Arn, !GetAtt TaskRole.Arn]
                Condition: { StringEquals: { iam:PassedToService: ecs-tasks.amazonaws.com } }
              - Sid: SyncCloudflarePrefixList
                Effect: Allow
                Action: [ec2:GetManagedPrefixListEntries, ec2:ModifyManagedPrefixList]
                Resource: !GetAtt CloudflarePrefixList.Arn
              - Sid: DescribePrefixLists
                Effect: Allow
                Action: ec2:DescribeManagedPrefixLists
                Resource: "*"

  # ----------------------------------------------------------- load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: ev-grid-energy-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: deletion_protection.enabled, Value: "true" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: ev-grid-energy-web-tg
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  # Before the certificate is issued: forward, for private pre-launch checks.
  # After: HTTP only redirects to the canonical HTTPS host.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: !If
        - HasCertificate
        - - Type: redirect
            RedirectConfig: { Protocol: HTTPS, Port: "443", Host: !Ref CanonicalHost, Path: "/#{path}", Query: "#{query}", StatusCode: HTTP_301 }
        - - { Type: forward, TargetGroupArn: !Ref TargetGroup }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      # Unknown Host headers (e.g. the raw ALB name) get a 404.
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: "404", ContentType: text/plain, MessageBody: Not found }

  CanonicalHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCertificate
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions: [{ Field: host-header, HostHeaderConfig: { Values: [!Ref CanonicalHost] } }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  WwwRedirectRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCertificate
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Conditions: [{ Field: host-header, HostHeaderConfig: { Values: [!Sub "www.${CanonicalHost}"] } }]
      Actions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", Host: !Ref CanonicalHost, Path: "/#{path}", Query: "#{query}", StatusCode: HTTP_301 }

  # ------------------------------------------------------------------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: ev-grid-energy-prod
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ev-grid-energy-web
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Sub ${Repository.RepositoryUri}:${ImageTag}
          Essential: true
          PortMappings: [{ ContainerPort: 3000, Protocol: tcp }]
          StopTimeout: 30
          Environment:
            - { Name: NEXT_PUBLIC_SITE_URL, Value: !Sub "https://${CanonicalHost}" }
            - { Name: LEADS_TABLE_NAME, Value: !Ref LeadsTable }
            - { Name: LEAD_NOTIFICATIONS_TOPIC_ARN, Value: !Ref LeadNotificationsTopic }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, AppFromAlbIngress, AlbToAppEgress]
    Properties:
      ServiceName: ev-grid-energy-web
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 30
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED # public subnet + SG instead of a NAT gateway
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - { ContainerName: web, ContainerPort: 3000, TargetGroupArn: !Ref TargetGroup }

  # ---------------------------------------------------------------- alarms
  NoHealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ev-grid-energy-unhealthy-targets
      AlarmDescription: EV Grid Energy has no healthy targets behind ev-grid-energy-alb (site down).
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OpsAlertsTopic]
      OKActions: [!Ref OpsAlertsTopic]

  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ev-grid-energy-alb-5xx
      AlarmDescription: 5 or more 5xx responses (ALB or application) in 5 minutes.
      Metrics:
        - Id: total
          Expression: "FILL(elb, 0) + FILL(target, 0)"
          ReturnData: true
        - Id: elb
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_ELB_5XX_Count
              Dimensions: [{ Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }]
            Period: 300
            Stat: Sum
        - Id: target
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions: [{ Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }]
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  LeadPipelineAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ev-grid-energy-lead-pipeline-failures
      AlarmDescription: A lead could not be stored, or its sales notification failed (the lead is still stored - check notificationStatus = failed).
      Metrics:
        - Id: total
          Expression: "FILL(notify, 0) + FILL(store, 0)"
          ReturnData: true
        - Id: notify
          ReturnData: false
          MetricStat:
            Metric: { Namespace: EVGridEnergy, MetricName: LeadNotificationFailures }
            Period: 300
            Stat: Sum
        - Id: store
          ReturnData: false
          MetricStat:
            Metric: { Namespace: EVGridEnergy, MetricName: LeadStoreFailures }
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  # ---------------------------------------------------------------- budget
  # Matches spend once the "Application" tag is activated as a cost
  # allocation tag (Billing console; available ~24h after first tagged usage).
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: ev-grid-energy-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 45, Unit: USD }
        CostFilters:
          TagKeyValue: ["user:Application$EV Grid Energy"]
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: SNS, Address: !Ref OpsAlertsTopic }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: SNS, Address: !Ref OpsAlertsTopic }]

Outputs:
  VpcId: { Value: !Ref Vpc }
  LoadBalancerDnsName: { Value: !GetAtt LoadBalancer.DNSName }
  RepositoryUri: { Value: !GetAtt Repository.RepositoryUri }
  ClusterName: { Value: !Ref Cluster }
  ServiceName: { Value: !GetAtt Service.Name }
  LeadsTableName: { Value: !Ref LeadsTable }
  LeadNotificationsTopicArn: { Value: !Ref LeadNotificationsTopic }
  OpsAlertsTopicArn: { Value: !Ref OpsAlertsTopic }
  CloudflarePrefixListId: { Value: !Ref CloudflarePrefixList }
  GitHubDeployRoleArn: { Value: !GetAtt GitHubDeployRole.Arn }
